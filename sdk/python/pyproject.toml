[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "kruntimes-sdk"
version = "0.0.0"
description = "Python Sandbox SDK for kruntimes Session-mode Runs"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
kubernetes = [
    "kubernetes>=32.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/kruntimes"]
