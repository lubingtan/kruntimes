apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: kruntimes-e2e-selfsigned
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: kruntimes-e2e-ca
spec:
  isCA: true
  commonName: kruntimes-e2e-ca
  secretName: kruntimes-e2e-ca
  issuerRef:
    name: kruntimes-e2e-selfsigned
    kind: ClusterIssuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: kruntimes-e2e-ca
spec:
  ca:
    secretName: kruntimes-e2e-ca
