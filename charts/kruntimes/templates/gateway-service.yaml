{{- if .Values.gateway.enabled }}
{{- include "kruntimes.gateway.validateProtocols" . }}
{{- include "kruntimes.gateway.validateTLS" . }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kruntimes.gateway.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kruntimes.gateway.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "kruntimes.gateway.selectorLabels" . | nindent 4 }}
  ports:
    {{- if has "http" .Values.gateway.protocols }}
    - name: http
      port: {{ .Values.gateway.httpServicePort }}
      targetPort: http
      protocol: TCP
    {{- end }}
    {{- if has "https" .Values.gateway.protocols }}
    - name: https
      port: {{ .Values.gateway.httpsServicePort }}
      targetPort: https
      protocol: TCP
    {{- end }}
{{- end }}
