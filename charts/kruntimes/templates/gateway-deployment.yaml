{{- if .Values.gateway.enabled }}
{{- include "kruntimes.gateway.validateProtocols" . }}
{{- include "kruntimes.gateway.validateTransferBounds" . }}
{{- include "kruntimes.gateway.validateTLS" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kruntimes.gateway.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kruntimes.gateway.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.gateway.replicas }}
  selector:
    matchLabels:
      {{- include "kruntimes.gateway.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.gateway.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "kruntimes.gateway.labels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "kruntimes.gateway.name" . }}
      {{- with .Values.gateway.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.gateway.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.gateway.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.gateway.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.gateway.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.gateway.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: gateway
          image: {{ include "kruntimes.image" (list . .Values.gateway.image) }}
          imagePullPolicy: {{ .Values.gateway.imagePullPolicy }}
          {{- with .Values.gateway.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          args:
            {{- if has "http" .Values.gateway.protocols }}
            - --http-bind-address={{ .Values.gateway.httpBindAddress }}
            {{- else }}
            - --http-bind-address=
            {{- end }}
            {{- if has "https" .Values.gateway.protocols }}
            - --https-bind-address={{ .Values.gateway.httpsBindAddress }}
            {{- end }}
            - --metrics-bind-address={{ .Values.gateway.metricsBindAddress }}
            - --health-probe-bind-address={{ .Values.gateway.probeBindAddress }}
            - --authorization-cache-ttl={{ .Values.gateway.authorizationCacheTTL }}
            - --authorization-cache-capacity={{ .Values.gateway.authorizationCacheCapacity }}
            - --max-concurrent-requests={{ .Values.gateway.maxConcurrentRequests }}
            - --max-request-body-bytes={{ int64 .Values.gateway.maxRequestBodyBytes }}
            - --max-response-body-bytes={{ int64 .Values.gateway.maxResponseBodyBytes }}
            - --max-header-bytes={{ int64 .Values.gateway.maxHeaderBytes }}
            {{- if has "https" .Values.gateway.protocols }}
            - --tls-certificate-file=/var/run/kruntimes/gateway-tls/{{ .Values.gateway.tls.certificateKey }}
            - --tls-private-key-file=/var/run/kruntimes/gateway-tls/{{ .Values.gateway.tls.privateKeyKey }}
            {{- end }}
          ports:
            {{- if has "http" .Values.gateway.protocols }}
            - containerPort: {{ .Values.gateway.httpPort }}
              name: http
              protocol: TCP
            {{- end }}
            {{- if has "https" .Values.gateway.protocols }}
            - containerPort: {{ .Values.gateway.httpsPort }}
              name: https
              protocol: TCP
            {{- end }}
            - containerPort: {{ .Values.gateway.metricsPort }}
              name: metrics
              protocol: TCP
            - containerPort: {{ .Values.gateway.probePort }}
              name: probes
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: probes
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: probes
            initialDelaySeconds: 1
            periodSeconds: 5
          resources:
            {{- toYaml .Values.gateway.resources | nindent 12 }}
          {{- if has "https" .Values.gateway.protocols }}
          volumeMounts:
            - name: gateway-tls
              mountPath: /var/run/kruntimes/gateway-tls
              readOnly: true
      volumes:
        - name: gateway-tls
          secret:
            secretName: {{ include "kruntimes.gateway.tlsSecretName" . }}
          {{- end }}
{{- end }}
