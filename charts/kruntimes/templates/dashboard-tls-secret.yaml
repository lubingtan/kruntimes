{{- if and .Values.dashboard.enabled .Values.dashboard.tls.selfSigned }}
{{- include "kruntimes.dashboard.validateTLS" . }}
{{- include "kruntimes.dashboard.ensureTLSCertificates" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kruntimes.dashboard.tlsSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kruntimes.dashboard.labels" . | nindent 4 }}
type: kubernetes.io/tls
data:
  {{ .Values.dashboard.tls.certificateKey }}: {{ index .Values "_dashboardCertificates" "tlsCert" | b64enc }}
  {{ .Values.dashboard.tls.privateKeyKey }}: {{ index .Values "_dashboardCertificates" "tlsKey" | b64enc }}
{{- end }}
