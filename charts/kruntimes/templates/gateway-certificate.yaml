{{- if and .Values.gateway.enabled (has "https" .Values.gateway.protocols) .Values.gateway.tls.certManager.enabled }}
{{- include "kruntimes.gateway.validateProtocols" . }}
{{- include "kruntimes.gateway.validateTLS" . }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "kruntimes.gateway.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kruntimes.gateway.labels" . | nindent 4 }}
spec:
  secretName: {{ .Values.gateway.tls.secretName }}
  dnsNames:
    - {{ include "kruntimes.gateway.name" . }}
    - {{ include "kruntimes.gateway.name" . }}.{{ .Release.Namespace }}
    - {{ include "kruntimes.gateway.name" . }}.{{ .Release.Namespace }}.svc
    - {{ include "kruntimes.gateway.name" . }}.{{ .Release.Namespace }}.svc.cluster.local
  issuerRef:
    name: {{ .Values.gateway.tls.certManager.issuerRef.name }}
    kind: {{ .Values.gateway.tls.certManager.issuerRef.kind }}
    group: {{ .Values.gateway.tls.certManager.issuerRef.group }}
{{- end }}
