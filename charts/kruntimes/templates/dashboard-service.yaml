{{- if .Values.dashboard.enabled }}
{{- include "kruntimes.dashboard.validateTLS" . }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kruntimes.dashboard.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kruntimes.dashboard.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "kruntimes.dashboard.selectorLabels" . | nindent 4 }}
  ports:
    - name: https
      port: {{ .Values.dashboard.servicePort }}
      targetPort: https
      protocol: TCP
{{- end }}
