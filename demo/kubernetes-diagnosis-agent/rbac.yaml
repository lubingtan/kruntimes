apiVersion: v1
kind: ServiceAccount
metadata:
  name: diagnosis-runtime
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: diagnosis-reader
rules:
  - apiGroups: [""]
    resources: ["pods", "events", "services"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: diagnosis-reader
subjects:
  - kind: ServiceAccount
    name: diagnosis-runtime
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: diagnosis-reader
